    <title>Remix: Nexusssgrammm</title>
    <script>
      // iOS PWA standalone navigation trap so links stay inside the app
      if (("standalone" in window.navigator) && window.navigator.standalone) {
        document.addEventListener('click', function(e) {
          var target = e.target;
          while (target && target.nodeName !== 'A' && target.nodeName !== 'HTML') {
            target = target.parentNode;
          }
          if (target && target.nodeName === 'A' && target.getAttribute('href') && !target.getAttribute('href').startsWith('http')) {
            e.preventDefault();
            window.location.href = target.getAttribute('href');
          }
        }, false);
      }
    </script>
